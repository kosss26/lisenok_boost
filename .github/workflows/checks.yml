name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - uses: actions/cache@v4
        with:
          path: tmp/media-cache
          key: media-v2-${{ runner.os }}-${{ hashFiles('tools/encode-media.py', 'requirements-build.txt', 'public/**') }}
          restore-keys: media-v2-${{ runner.os }}-
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 8081 --strictPort > /tmp/lisenok-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8081/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8081/ > /dev/null
          BASE_URL=http://127.0.0.1:8081/ node --test --test-concurrency=1 tests/e2e/boost.test.mjs tests/e2e/parents.test.mjs tests/e2e/drag.test.mjs tests/e2e/difficulty.test.mjs tests/e2e/friends.test.mjs tests/e2e/visual.test.mjs tests/e2e/worlds-motion.test.mjs
      - name: Offline smoke test
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 8081 --strictPort > /tmp/lisenok-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8081/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8081/ > /dev/null
          OFFLINE=1 BASE_URL=http://127.0.0.1:8081/ node --test --test-concurrency=1 tests/e2e/offline.test.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-logs
          path: /tmp/lisenok-preview.log
